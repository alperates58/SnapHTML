<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapHTML — Klon Önizleme & Test</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <!-- Sabit Üst Toolbar -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <span class="brand-title">SnapHTML</span>
      </div>

      <div class="divider"></div>

      <!-- Sayfa Bilgileri -->
      <div class="meta-group">
        <span class="meta-pill domain-pill" id="metaDomain">Yükleniyor...</span>
        <span class="meta-pill" id="metaSize">0 KB</span>
        <span class="meta-pill" id="metaNodes">0 DOM</span>
        <span class="meta-pill" id="metaViewport">1920×1080</span>
      </div>
    </div>

    <!-- Ortadaki Görünüm Modları -->
    <div class="toolbar-center">
      <div class="tab-group">
        <button class="tab-btn active" data-tab="live">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Canlı Klon</span>
        </button>
        <button class="tab-btn" data-tab="ai">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
          <span>AI Röntgeni</span>
        </button>
        <button class="tab-btn" data-tab="code">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span>Kaynak Kod</span>
        </button>
      </div>

      <!-- Cihaz Genişliği Değiştirici (Sadece canlı modda aktif) -->
      <div class="device-switcher" id="deviceSwitcher">
        <button class="dev-btn active" data-width="100%" title="Tam Genişlik">Masaüstü</button>
        <button class="dev-btn" data-width="768px" title="Tablet Boyutu (768px)">Tablet</button>
        <button class="dev-btn" data-width="390px" title="Mobil Boyut (390px)">Mobil</button>
      </div>
    </div>

    <!-- Sağdaki Aksiyonlar -->
    <div class="toolbar-right">
      <!-- AI Prompt Kopyala -->
      <button class="btn btn-purple" id="btnCopyAiPrompt" title="Claude / ChatGPT için promptu kopyala">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>AI İçin Kopyala</span>
      </button>

      <!-- HTML Kopyala -->
      <button class="btn btn-secondary" id="btnCopyHtml" title="Tüm HTML'i panoya kopyala">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>HTML Kopyala</span>
      </button>

      <!-- Doğrudan İndir -->
      <button class="btn btn-primary" id="btnDownload" title="Bağımsız .html dosyası olarak kaydet">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>HTML İndir</span>
      </button>
    </div>
  </header>

  <!-- Ana İçerik Alanı -->
  <main class="content-viewport">
    <!-- 1. Canlı Görünüm (Iframe Sandbox) -->
    <section class="tab-pane active" id="paneLive">
      <div class="iframe-container" id="iframeContainer">
        <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts allow-forms" title="Canlı Klon Önizlemesi"></iframe>
      </div>
    </section>

    <!-- 2. AI Röntgeni -->
    <section class="tab-pane" id="paneAi">
      <div class="ai-view-container">
        <div class="ai-sidebar">
          <h3>🎨 Renk Paleti</h3>
          <div class="palette-list" id="paletteList"></div>

          <h3>🧱 Tespit Edilen Yapı</h3>
          <div class="stats-list" id="statsList"></div>

          <h3>⚡ Framework & Kütüphaneler</h3>
          <div class="tags-list" id="tagsList"></div>
        </div>

        <div class="ai-main">
          <div class="ai-prompt-box">
            <div class="prompt-header">
              <span>AI Asistan Promptu (Hazır Şablon)</span>
              <button class="btn btn-sm btn-purple" id="btnCopyPromptInline">Kopyala</button>
            </div>
            <pre class="prompt-code" id="promptText"></pre>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Kaynak Kod -->
    <section class="tab-pane" id="paneCode">
      <div class="code-view-container">
        <div class="code-header">
          <span id="codeLength">0 karakter</span>
          <button class="btn btn-sm btn-secondary" id="btnCopyCodeInline">Tüm Kodu Kopyala</button>
        </div>
        <pre class="code-block"><code id="rawHtmlCode"></code></pre>
      </div>
    </section>
  </main>

  <script type="module" src="preview.js"></script>
</body>
</html>
